
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>YasevYa | Uzman İlişki Analizi</title>
  <meta name="description" content="YasevYa - İlişkinizi kategorilere ayırarak analiz eden yapay zeka destekli uygulama. Android ve iOS için ücretsiz indirin." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-1: #070513;
      --bg-2: #15081f;
      --pink: #ff2b80;
      --pink-light: #ff6fb0;
      --text: #ffffff;
      --muted: rgba(255,255,255,.72);
      --line: rgba(255,255,255,.12);
      --card: rgba(255,255,255,.05);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 560px at 50% 0%, rgba(255,35,128,.22), transparent 45%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2) 50%, var(--bg-1));
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 40px;
    }

    main {
      width: 100%;
      max-width: 480px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 28px 0 18px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--pink), #b0206a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 8px 20px rgba(255,43,128,.4);
    }

    .brand-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .2px;
    }

    .hero-image {
      width: 100%;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: 0 20px 50px rgba(255,30,130,.18);
      margin-bottom: 22px;
    }

    .hero-image img {
      width: 100%;
      display: block;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      line-height: 1.3;
      margin: 0 0 10px;
    }

    .tagline {
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      margin: 0 0 26px;
      max-width: 380px;
      margin-left: auto;
      margin-right: auto;
    }

    .cta-row {
      display: flex;
      justify-content: center;
      margin-bottom: 34px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--pink), #c21868);
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      padding: 15px 36px;
      border-radius: 999px;
      box-shadow: 0 16px 36px rgba(255,30,130,.4);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 44px rgba(255,30,130,.5);
    }

    .gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 34px;
    }

    .gallery img {
      width: 100%;
      display: block;
      border-radius: 16px;
      border: 1px solid var(--line);
    }

    nav.links {
      margin-top: 6px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12.5px;
    }

    .links a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
    }

    .links a:hover { color: #fff; }

    .separator { color: rgba(255,255,255,.3); }

    footer {
      text-align: center;
      padding: 22px 16px 8px;
      color: var(--muted);
      font-size: 13px;
    }

    footer strong { color: var(--pink-light); }

    @media (max-width: 420px) {
      h1 { font-size: 21px; }
      .gallery { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <main>
    <div class="brand-row">
      <span class="brand-icon">?</span>
      <span class="brand-name">YasevYa</span>
    </div>

    <div class="hero-image">
      <img src="yasevya-hero.jpg" alt="YasevYa uzman ilişki analizi uygulaması">
    </div>

    <h1>İlişkinizi Gerçekten Ne Kadar Tanıyorsunuz?</h1>
    <p class="tagline">YasevYa, ilişkinizi farklı kategorilerde yapay zeka ile analiz eder; görmediğiniz riskleri ve uyumunuzu ortaya çıkarır.</p>

    <div class="cta-row">
      <a href="/apps/yasevya/download/" class="download-btn">YasevYa'yı İndir</a>
    </div>

    <div class="gallery">
      <img src="yasevya-tanima.jpg" alt="Birbirinizi ne kadar tanıyorsunuz analizi">
      <img src="yasevya-eslesme.jpg" alt="Eşleşme ve uyum yüzdesi analizi">
    </div>

    <nav class="links" aria-label="Yasal bağlantılar">
      <a href="https://reggbook.com/apps/yasevya/gizliliksozlesmesi/">Gizlilik Sözleşmesi</a>
      <span class="separator">-</span>
      <a href="https://reggbook.com/apps/yasevya/kullanim-kosullari/">Kullanıcı Sözleşmesi</a>
      <span class="separator">-</span>
      <a href="https://reggbook.com/apps/yasevya/mesafeli-satis-sozlesmesi/">Mesafeli Satış Sözleşmesi</a>
    </nav>

    <footer>
      <strong>ReggBook</strong> sponsorluğunda
    </footer>
  </main>

</body>
</html>
