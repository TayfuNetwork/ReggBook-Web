  <script>

    const ANDROID_PACKAGE =
      "com.tayfunetwork.yasevya";


    const PLAY_STORE_URL =
      "https://play.google.com/store/apps/details?id=" +
      ANDROID_PACKAGE;


    /*
      Android cihazda doğrudan Google Play
      uygulamasını açmayı dener.
    */
    const PLAY_STORE_INTENT_URL =
      "intent://details?id=" +
      ANDROID_PACKAGE +
      "#Intent;" +
      "scheme=market;" +
      "package=com.android.vending;" +
      "S.browser_fallback_url=" +
      encodeURIComponent(PLAY_STORE_URL) +
      ";end";


    const APP_STORE_URL =
      "https://apps.apple.com/tr/app/yasevya/id6777557830?l=tr";


    /*
      iOS cihazda doğrudan App Store
      uygulamasını açmayı dener.
    */
    const APP_STORE_INTENT_URL =
      APP_STORE_URL.replace(
        /^https:/,
        "itms-apps:"
      );


    /*
      Windows ve bilinmeyen cihaz fallback.
    */
    const WINDOWS_ZIP_URL =
      "https://reggbook.com";

    const FALLBACK_URL =
      "https://reggbook.com/apps/yasevya";


    let redirectUrl = FALLBACK_URL;
    let manualLinkUrl = FALLBACK_URL;
    let platformName = "YasevYa";
    let detectedPlatform = "other";


    function detectPlatform() {

      const ua =
        navigator.userAgent ||
        navigator.vendor ||
        window.opera;


      /*
        ANDROID
      */
      if (/android/i.test(ua)) {

        redirectUrl =
          PLAY_STORE_INTENT_URL;

        manualLinkUrl =
          PLAY_STORE_URL;

        platformName =
          "Google Play Mağazası";

        detectedPlatform =
          "android";

        return;
      }


      /*
        IOS
      */
      if (
        /iPad|iPhone|iPod/.test(ua) &&
        !window.MSStream
      ) {

        redirectUrl =
          APP_STORE_INTENT_URL;

        manualLinkUrl =
          APP_STORE_URL;

        platformName =
          "Apple App Store";

        detectedPlatform =
          "ios";

        return;
      }


      /*
        WINDOWS
      */
      if (/Windows NT/i.test(ua)) {

        redirectUrl =
          WINDOWS_ZIP_URL;

        manualLinkUrl =
          WINDOWS_ZIP_URL;

        platformName =
          "ReggBook";

        detectedPlatform =
          "windows";

        return;
      }


      /*
        DİĞER CİHAZLAR
      */
      redirectUrl =
        FALLBACK_URL;

      manualLinkUrl =
        FALLBACK_URL;

      platformName =
        "YasevYa";

      detectedPlatform =
        "other";
    }


    function trackStoreRedirect() {

      /*
        Mevcut YasevYa-Download eventini koruyoruz.

        Bu event mağazaya yönlendirme aşamasında
        gönderilir.

        Gerçek uygulama kurulumu ise uygulamadaki
        Meta SDK tarafından ölçülür.
      */
      fbq(
        'trackCustom',
        'YasevYa-Download',
        {
          platform: detectedPlatform,
          value: 1,
          currency: 'TRY'
        }
      );


      /*
        Ayrı mağaza yönlendirme eventi.
      */
      fbq(
        'trackCustom',
        'StoreRedirect',
        {
          platform: detectedPlatform
        }
      );


      /*
        Windows özel eventi.
      */
      if (detectedPlatform === "windows") {

        fbq(
          'trackCustom',
          'WindowsDesktopDownload'
        );
      }
    }


    function redirectNow() {

      detectPlatform();


      const storeTextEl =
        document.getElementById("storeText");

      const storeLinkEl =
        document.getElementById("storeLink");


      storeTextEl.innerText =
        `${platformName} açılıyor...`;

      storeLinkEl.href =
        manualLinkUrl;


      /*
        Manuel butona basılırsa da
        doğru mağazaya gider.
      */
      storeLinkEl.onclick = function() {

        fbq(
          'trackCustom',
          'ManualStoreRedirect',
          {
            platform: detectedPlatform
          }
        );
      };


      /*
        Meta Pixel eventlerini gönder.
      */
      trackStoreRedirect();


      /*
        Pixel eventlerinin gönderilmesine
        kısa süre tanıyoruz.
      */
      setTimeout(
        function() {

          window.location.replace(
            redirectUrl
          );

        },
        500
      );
    }


    window.addEventListener(
      "load",
      redirectNow
    );

  </script>
