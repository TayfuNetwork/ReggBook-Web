<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="ReggBook ile işletmeden kolayca randevu alın." />
    <meta property="og:title" content="ReggBook | Randevu Al" />
    <meta property="og:description" content="İşletmeden web üzerinden randevu alın." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://reggbook.com/route/providerprofile/logo.png" />
    <title>ReggBook | Randevu Al</title>

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var companyId = (params.get("id") || "").trim();
        var target = companyId
          ? "https://reggbook.com/authappt/?company=" + encodeURIComponent(companyId)
          : "https://reggbook.com/authappt/";
        window.location.replace(target);
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=https://reggbook.com/authappt/" />
    </noscript>

    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f4fbfa;
        color: #102a2a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(
          circle at top,
          #dff7f2 0,
          #f7fbfb 52%,
          #eef7f6 100%
        );
      }

      main {
        width: min(100%, 460px);
        padding: 34px 26px;
        border: 1px solid #d8ece9;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 22px 60px rgba(15, 118, 110, 0.16);
        text-align: center;
      }

      .logo {
        display: block;
        width: min(190px, 62vw);
        height: auto;
        margin: 0 auto 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(22px, 6vw, 28px);
        line-height: 1.15;
      }

      p {
        margin: 14px auto 26px;
        color: #526b69;
        font-size: 16px;
        line-height: 1.6;
      }

      a.manual-link {
        color: #0f766e;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <main>
      <img class="logo" src="logo.png" alt="ReggBook" />
      <h1>Randevu sayfasına yönlendiriliyorsunuz…</h1>
      <p>
        Birkaç saniye içinde yönlenmezseniz
        <a class="manual-link" href="https://reggbook.com/authappt/">buraya tıklayın</a>.
      </p>
    </main>
  </body>
</html>
